<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma's Health Record</title>
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#f0ede6; --ink:#1f2328; --ink-2:#555b63; --ink-3:#80868e;
  --line:#e2ddd3; --accent:#2f6f6a; --accent-ink:#ffffff; --accent-soft:#e2efed;
  --dhaka:#3d7a4a; --dhaka-soft:#e4f0e6; --vellore:#3559a8; --vellore-soft:#e3eaf7;
  --home:#8a5a1c; --home-soft:#f6ecdc; --up:#b4462f; --up-soft:#f8e6e1; --bgc:#6b6f76; --bgc-soft:#ecedef;
  --good:#2c7a3f; --good-soft:#e2f2e6; --warn:#a0620a; --warn-soft:#fbefd9; --bad:#b33a2b; --bad-soft:#f9e3df;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05); --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --surface:#1d2024; --surface-2:#25292e; --ink:#e8e6e1; --ink-2:#b4b8bd; --ink-3:#868b92;
    --line:#32373d; --accent:#6fb8b0; --accent-ink:#0f1a19; --accent-soft:#1f3432;
    --dhaka:#7cc08a; --dhaka-soft:#1f3124; --vellore:#8fa9e6; --vellore-soft:#1f2940;
    --home:#d9a35c; --home-soft:#3a2d1b; --up:#ec8a73; --up-soft:#3d231d; --bgc:#a3a8af; --bgc-soft:#2a2d31;
    --good:#7cc58c; --good-soft:#1d3323; --warn:#e5b45e; --warn-soft:#3a2f18; --bad:#ee8b7d; --bad-soft:#3d211d;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --surface:#1d2024; --surface-2:#25292e; --ink:#e8e6e1; --ink-2:#b4b8bd; --ink-3:#868b92;
  --line:#32373d; --accent:#6fb8b0; --accent-ink:#0f1a19; --accent-soft:#1f3432;
  --dhaka:#7cc08a; --dhaka-soft:#1f3124; --vellore:#8fa9e6; --vellore-soft:#1f2940;
  --home:#d9a35c; --home-soft:#3a2d1b; --up:#ec8a73; --up-soft:#3d231d; --bgc:#a3a8af; --bgc-soft:#2a2d31;
  --good:#7cc58c; --good-soft:#1d3323; --warn:#e5b45e; --warn-soft:#3a2f18; --bad:#ee8b7d; --bad-soft:#3d211d;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* header */
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-row{display:flex;align-items:center;gap:12px;padding:12px 0 6px}
.top h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em}
.top .sub{color:var(--ink-3);font-size:13px}
.top .spacer{flex:1}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:14px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--ink-2);padding:7px 13px;border-radius:999px;font-size:14px;font-weight:550;white-space:nowrap}
nav.tabs a:hover{background:var(--surface-2)}
.menu-btn{display:none}
@media (max-width:640px){
  .top-row{flex-wrap:wrap}
  .top-row>div:first-child{flex:1;min-width:0}
  .top-row .spacer{display:none}
  .menu-btn{display:flex;align-items:center;gap:8px;order:3;width:100%;margin:8px 0 2px;padding:10px 14px;border:1.5px solid var(--accent);border-radius:12px;background:var(--surface);color:var(--accent);font:inherit;font-weight:650;font-size:15px;cursor:pointer}
  .menu-btn .mb-ico{font-size:18px;line-height:1}
  .menu-btn .mb-cur{margin-left:auto;color:var(--ink-2);font-weight:550;font-size:14px}
  .menu-btn .mb-cur::before{content:"You're on: ";color:var(--ink-3);font-weight:400}
  .menu-btn[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
  .menu-btn[aria-expanded="true"] .mb-cur{display:none}
  nav.tabs{display:none}
  nav.tabs.open{display:grid;grid-template-columns:1fr 1fr;gap:6px;overflow:visible;padding:6px 0 12px}
  nav.tabs.open a{text-align:center;padding:11px 8px;border:1px solid var(--line);border-radius:10px;white-space:normal}
}
nav.tabs a.on{background:var(--accent);color:var(--accent-ink)}

main{padding:22px 0 80px}
.backbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));z-index:30;max-width:calc(100vw - 32px)}
.backbar a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.backbar a{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;font-size:14.5px;padding:9px 16px;border-radius:999px;box-shadow:var(--shadow)}
.backbar a:hover{filter:brightness(1.08)}
h2.view-title{font-size:26px;letter-spacing:-.02em;margin:4px 0 4px}
p.lede{color:var(--ink-2);margin:0 0 20px;max-width:760px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.grid{display:grid;gap:14px}
.grid.two{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.muted{color:var(--ink-3)}
.small{font-size:13.5px}

/* banners */
.banner.bone{background:var(--bad-soft);border:2px solid color-mix(in srgb,var(--bad) 55%,transparent)}
.banner.bone p{margin:6px 0}
.bone-h{font-weight:700;font-size:16.5px;color:var(--bad);margin-bottom:2px}
.bone-act{background:var(--surface);border-radius:8px;padding:8px 12px}
.bone-more summary{cursor:pointer;font-weight:600;color:var(--bad);margin:6px 0}
.bone-more h4{margin:10px 0 4px;font-size:14px}
.bone-more ul{margin:0;padding-left:20px}
.banner{display:flex;gap:14px;align-items:flex-start;border-radius:var(--r);padding:14px 18px;margin-bottom:14px}
.banner .b-ico{font-size:22px;line-height:1.2}
.banner.up{background:var(--up-soft);border:1px solid color-mix(in srgb,var(--up) 35%,transparent)}
.banner.em{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.banner b{font-weight:650}
.banner ul{margin:6px 0 0;padding-left:20px}

/* story */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:18px}
@media (max-width:800px){.hero{grid-template-columns:1fr}}
.hero .card h3{margin:0 0 6px;font-size:15px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.big-dx{font-size:22px;font-weight:650;letter-spacing:-.01em;line-height:1.3;margin:0 0 6px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14.5px;margin:0}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0}
.story-block{margin-bottom:12px}
.story-block h3{margin:0 0 6px;font-size:18px}
.story-block p{margin:0;color:var(--ink)}
.diagram{display:block;width:100%;max-width:520px;height:auto;margin:6px auto 0}

/* timeline */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
.tl{position:relative;margin-left:8px}
.tl::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-left:44px;margin-bottom:18px}
.tl-dot{position:absolute;left:3px;top:20px;width:18px;height:18px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--c)}
.tl-item .card{border-left:4px solid var(--c)}
.tl-date{font-weight:650;font-size:14px;color:var(--c)}
.tl-place{font-size:13px;color:var(--ink-3)}
.tl-title{font-size:18px;font-weight:650;margin:2px 0 6px;letter-spacing:-.01em}
.tl-item p{margin:0 0 8px}
.tl-item ul{margin:4px 0 8px;padding-left:20px;color:var(--ink-2);font-size:14.5px}
.ph-background{--c:var(--bgc);--cs:var(--bgc-soft)}
.ph-dhaka{--c:var(--dhaka);--cs:var(--dhaka-soft)}
.ph-gap{--c:var(--ink-3);--cs:var(--surface-2)}
.ph-vellore{--c:var(--vellore);--cs:var(--vellore-soft)}
.ph-home{--c:var(--home);--cs:var(--home-soft)}
.ph-upcoming{--c:var(--up);--cs:var(--up-soft)}
.tl-item.ph-gap .card{border-style:dashed;background:transparent;box-shadow:none}
.doc-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.doc-chip{display:flex;align-items:center;gap:8px;background:var(--cs,var(--surface-2));border:1px solid var(--line);border-radius:10px;padding:4px 10px 4px 4px;cursor:pointer;text-decoration:none;color:var(--ink);font-size:13.5px;font-weight:550}
.doc-chip img{width:34px;height:44px;object-fit:cover;border-radius:5px;border:1px solid var(--line);background:#fff}
.doc-chip:hover{border-color:var(--c,var(--accent))}

/* reports */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13.5px}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.report{margin-bottom:18px;scroll-margin-top:120px}
.report-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between}
.report h3{margin:0;font-size:20px;letter-spacing:-.01em}
.report .meta{color:var(--ink-3);font-size:13.5px;margin:2px 0 12px}
.report-body{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.report-body{grid-template-columns:1fr}}
.report h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.report ul.kf{margin:0;padding-left:18px;font-size:14.5px}
.report ul.kf li{margin-bottom:3px}
.plain{background:var(--accent-soft);border-radius:12px;padding:14px 16px;font-size:15px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;margin-top:14px}
.thumbs button{flex:none;border:1px solid var(--line);border-radius:8px;padding:0;background:#fff;cursor:zoom-in;overflow:hidden;position:relative}
.thumbs img{display:block;height:150px;width:auto}
.thumbs .pg{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:1px 6px;border-radius:6px}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.term{border:1px dashed var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:2px 10px;font-size:13px;cursor:help}

/* conditions */
.cond h3{margin:0 0 6px;font-size:17px;line-height:1.35}
.cond dl{display:grid;grid-template-columns:62px 1fr;gap:4px 10px;margin:10px 0 8px;font-size:14.5px}
.cond dt{color:var(--ink-3);font-size:13px;padding-top:1px}
.cond dd{margin:0}
.st-active{background:var(--warn-soft);color:var(--warn)}
.st-monitoring{background:var(--vellore-soft);color:var(--vellore)}
.st-resolved{background:var(--good-soft);color:var(--good)}
.st-incidental{background:var(--bgc-soft);color:var(--bgc)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:600;background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:none}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.grp td{background:var(--surface-2);font-weight:650;font-size:13px;color:var(--ink-2)}
.v{display:inline-block;padding:1px 8px;border-radius:6px;font-weight:600}
.v.low,.v.high{background:var(--bad-soft);color:var(--bad)}
.v.borderline{background:var(--warn-soft);color:var(--warn)}
.v.good{background:var(--good-soft);color:var(--good)}
.tbl-wrap.scroll table{min-width:680px}
@media (max-width:640px){
  .tbl-wrap.cards{overflow:visible}
  .tbl-wrap.cards table{min-width:0}
  .tbl-wrap.cards thead{display:none}
  .tbl-wrap.cards table,.tbl-wrap.cards tbody,.tbl-wrap.cards tr{display:block;width:100%}
  .tbl-wrap.cards tr{border-bottom:1px solid var(--line);padding:10px 14px}
  .tbl-wrap.cards td{display:block;border:none;padding:4px 0;text-align:left;white-space:normal;overflow-wrap:anywhere}
  .tbl-wrap.cards td[data-label]{display:grid;grid-template-columns:40% 1fr;gap:10px;align-items:baseline}
  .tbl-wrap.cards td[data-label]::before{content:attr(data-label);font-size:12.5px;line-height:1.35;color:var(--ink-3)}
  .tbl-wrap.cards td.empty{display:none}
  .tbl-wrap.cards tr.grp{padding:0;background:var(--surface-2)}
  .tbl-wrap.cards tr.grp td{display:block;padding:8px 14px}
}
@media (max-width:640px){
  .tbl-wrap.stack thead{display:none}
  .tbl-wrap.stack table,.tbl-wrap.stack tbody,.tbl-wrap.stack tr,.tbl-wrap.stack td{display:block;width:100%}
  .tbl-wrap.stack tr{border-bottom:1px solid var(--line);padding:8px 0}
  .tbl-wrap.stack td{border:none;padding:2px 14px}
  .tbl-wrap.stack tr.grp{padding:0}
  .tbl-wrap.stack tr.grp td{padding:8px 14px}
}
.med-name{font-weight:650}
.med-note{color:var(--ink-3);font-size:13.5px}

/* diet */
.meal{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:none}
.meal .t{font-weight:650;color:var(--accent);font-variant-numeric:tabular-nums}
.meal .m{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{padding:4px 10px;border-radius:999px;font-size:13.5px}
.chips.no span{background:var(--bad-soft);color:var(--bad)}
.chips.yes span{background:var(--good-soft);color:var(--good)}

/* questions */
.q{display:flex;gap:12px;align-items:flex-start}
.q input{margin-top:6px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.q .topic{font-weight:650}
.q.done .qt{text-decoration:line-through;color:var(--ink-3)}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(10,12,14,.92);z-index:100;display:none;flex-direction:column}
.lb.open{display:flex}
.lb-bar{display:flex;align-items:center;gap:10px;color:#eee;padding:10px 16px;font-size:14px}
.lb-bar .spacer{flex:1}
.lb-bar button,.lb-bar a{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;text-decoration:none;font-size:14px}
.lb-stage{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:0 12px 16px}
.lb-stage img{max-width:100%;height:auto;background:#fff;border-radius:4px;cursor:zoom-in}
.lb-stage.zoom img{max-width:none;width:180%;cursor:zoom-out}
@media (max-width:700px){.lb-stage.zoom img{width:300%}}

/* tooltip popover */
.pop{position:fixed;z-index:120;max-width:320px;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none}
.pop b{display:block;margin-bottom:2px}
.xref{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.gl-demo{border-bottom:1.5px dotted var(--accent)}
.gl{border-bottom:1.5px dotted var(--accent);cursor:help;border-radius:2px}
.gl:hover,.gl:focus{background:color-mix(in srgb,var(--accent) 14%,transparent);outline:none}

.mg-keys{display:grid;gap:8px;margin:0 0 22px}
.mg-key{padding:11px 14px;border-radius:10px;font-size:14.5px;line-height:1.5;border:1px solid var(--line);background:var(--surface)}
.mg-key.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.mg-key.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.mg-group{font-size:13px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 8px}
details.mg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:10px}
details.mg>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
details.mg>summary::-webkit-details-marker{display:none}
details.mg>summary::before{content:"▸";color:var(--ink-3);transition:transform .15s;display:inline-block}
details.mg[open]>summary::before{transform:rotate(90deg)}
.mg-name{font-weight:650;font-size:16px}
.mg-dose{color:var(--ink-2);font-size:14px}
.mg-body{padding:0 18px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px 22px}
@media (max-width:720px){.mg-body{grid-template-columns:1fr}}
.mg-sec h4{margin:6px 0 4px;font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3)}
.mg-sec ul{margin:0;padding-left:18px}.mg-sec li{margin:2px 0}
.mg-sec p{margin:0}
.mg-sec.full{grid-column:1/-1}
.mg-sec.serious h4{color:var(--bad)}
.mg-sec.stop{background:var(--warn-soft);border-radius:8px;padding:8px 12px}
.mg-src a{font-size:13px;margin-right:12px;color:var(--accent)}
.footer-note{margin-top:30px;font-size:13px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:14px}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.section-h{font-size:18px;margin:26px 0 10px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div>
        <h1 id="pname">Health Record</h1>
        <div class="sub" id="psub"></div>
      </div>
      <div class="spacer"></div>
      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="tabs"><span class="mb-ico">☰</span><span class="mb-txt">Menu</span><span class="mb-cur" id="menuCur"></span></button>
      <button class="icon-btn" id="themeBtn" title="Toggle light/dark">◐</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main class="wrap" id="view"></main>

<div class="lb" id="lb" role="dialog" aria-modal="true">
  <div class="lb-bar">
    <button id="lbPrev">‹ Prev</button>
    <span id="lbCap"></span>
    <button id="lbNext">Next ›</button>
    <div class="spacer"></div>
    <a id="lbOpen" target="_blank" rel="noopener">Open full size ↗</a>
    <button id="lbClose">✕ Close</button>
  </div>
  <div class="lb-stage" id="lbStage"><img id="lbImg" alt=""></div>
</div>
<div class="pop" id="pop"></div>

<script src="data/health-data.js"></script>
<script src="data/med-guide.js"></script>
<script src="data/terms.js"></script>
<script>
(function(){
const H = window.HEALTH;
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
const thumb = p => `scans/thumbs/page-${pad(p)}.jpg`;
const full  = p => `scans/original/page-${pad(p)}.jpg`;
const docById = Object.fromEntries(H.documents.map(d=>[d.id,d]));
const fmtDate = iso => { const d=new Date(iso+"T00:00:00"); return isNaN(d)?iso:d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); };
const store = {
  get(k,def){ try{ const v=localStorage.getItem("mh:"+k); return v==null?def:JSON.parse(v);}catch(e){return def;} },
  set(k,v){ try{ localStorage.setItem("mh:"+k,JSON.stringify(v)); }catch(e){} }
};

// ---------- theme ----------
const applyTheme = t => { if(t) document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme"); };
applyTheme(store.get("theme",null));
$("#themeBtn").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.getAttribute("data-theme") || (dark?"dark":"light");
  const nxt = cur==="dark"?"light":"dark"; applyTheme(nxt); store.set("theme",nxt);
};

$("#pname").textContent = H.patient.name;

const VIEWS = [
  ["story","Overview"],["timeline","Timeline"],["reports","Reports"],["conditions","Conditions"],
  ["medicines","Medicines"],["medguide","Medicine guide"],["labs","Lab values"],["diet","Diet"],["questions","For the doctor"],["progress","Progress"]
];
function renderTabs(cur){
  const lab=(VIEWS.find(([k])=>k===cur)||[,""])[1]; const mc=document.getElementById("menuCur"); if(mc) mc.textContent=lab;
  setMenu(false);
  $("#tabs").innerHTML = VIEWS.map(([k,l])=>`<a href="#${k}" class="${k===cur?"on":""}">${l}</a>`).join("");
  const on = $("#tabs a.on"); if(on) on.scrollIntoView({block:"nearest",inline:"center"});
}

function setMenu(open){
  const b=document.getElementById("menuBtn"), t=document.getElementById("tabs"); if(!b||!t) return;
  b.setAttribute("aria-expanded", open?"true":"false"); t.classList.toggle("open", open);
  b.querySelector(".mb-txt").textContent = open ? "Close menu" : "Menu";
}
document.addEventListener("click", e=>{ if(e.target.closest("#menuBtn")){ setMenu(document.getElementById("menuBtn").getAttribute("aria-expanded")!=="true"); } });

// ---------- shared bits ----------
function docChips(ids){
  if(!ids||!ids.length) return "";
  return `<div class="doc-links">${ids.map(id=>{const d=docById[id]; if(!d) return "";
    return `<a class="doc-chip" href="#reports/${d.id}"><img src="${thumb(d.pages[0])}" alt="" loading="lazy">${esc(d.title)}</a>`;}).join("")}</div>`;
}
function reviewBanner(){
  const ev = H.timeline.find(e=>e.phase==="upcoming"); if(!ev) return "";
  const days = Math.round((new Date(ev.sortDate+"T00:00:00") - new Date(new Date().toDateString()))/864e5);
  const when = days>0?`in about <b>${days} days</b>`:(days===0?"<b>today</b>":`<b>${-days} days ago</b>`);
  return `<div class="banner up"><div class="b-ico">📅</div><div><b>${esc(ev.title)}</b>: due ${when} (${esc(ev.date.replace("due ",""))}). ${esc(ev.summary)}</div></div>`;
}
function boneBanner(full=true){
  const b=H.boneAlert; if(!b) return "";
  if(!full) return `<div class="banner bone"><div class="b-ico">🦴</div><div><b>${esc(b.title)}</b> <a href="#story">See what to watch for and how to lower the risk →</a></div></div>`;
  return `<div class="banner bone"><div class="b-ico">🦴</div><div>
    <div class="bone-h">${esc(b.title)}</div>
    ${b.facts.map(f=>`<p>${f}</p>`).join("")}
    <p class="bone-act">👉 ${b.action}</p>
    <details class="bone-more"><summary>Signs of a spine fracture, how to lower the risk, and when to get help</summary>
      <h4>Signs to watch for</h4><p>${b.signs}</p>
      <h4>Lowering the risk of a fall at home (NHS)</h4><ul>${b.prevent.map(x=>`<li>${x}</li>`).join("")}</ul>
      <h4>When to get help</h4><p>${b.help}</p>
      <p class="small">Sources: ${b.sources.map(([l,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(l)} ↗</a>`).join(" · ")}</p>
    </details>
    ${docChips(b.docs)}
  </div></div>`;
}
function emergencyBanner(){
  const e=H.emergency;
  return `<div class="banner em"><div class="b-ico">🚨</div><div><b>Go to the nearest hospital immediately if:</b>
  <ul>${e.signs.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>
  <div class="small" style="margin-top:6px">CMC 24×7 helpline: <b>${esc(e.cmcHelpline)}</b> · CMC ambulance: ${esc(e.cmcAmbulance)}</div></div></div>`;
}

// ---------- tap-to-explain terms ----------
const TERM_RX = (window.TERMS||[]).map(([key,pat,flags,title,text])=>{
  if(title && !H.glossary[key]) H.glossary[key]=[title,text];
  return H.glossary[key] ? {key, rx:new RegExp(pat, (flags||"")+"g")} : null;
}).filter(Boolean);
const TERM_SKIP = "a,button,summary,svg,script,style,textarea,input,select,.gl,.term,.pop,.backbar,h2.view-title";
const TERM_BOX = ".card,.tl-item,details,tr,.banner,.mg-key,.lede,.mg-sec,li";
function linkTerms(root){
  if(!root || !TERM_RX.length) return;
  const seen = new Map();   // container -> Set of term keys already underlined
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode(n){
    if(!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
    return n.parentElement.closest(TERM_SKIP) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT; }});
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  for(let node of nodes){
    const box = node.parentElement.closest(TERM_BOX) || root;
    let used = seen.get(box); if(!used){ used=new Set(); seen.set(box,used); }
    while(node){
      const txt=node.nodeValue; let best=null;
      for(const t of TERM_RX){
        if(used.has(t.key)) continue;
        t.rx.lastIndex=0; const m=t.rx.exec(txt);
        if(m && m[0] && (!best || m.index<best.i)) best={i:m.index, len:m[0].length, key:t.key};
      }
      if(!best) break;
      used.add(best.key);
      const mid = node.splitText(best.i); const rest = mid.splitText(best.len);
      const sp = document.createElement("span");
      sp.className="gl"; sp.dataset.term=best.key; sp.tabIndex=0; sp.setAttribute("role","button");
      sp.title="Tap for a plain explanation"; sp.textContent=mid.nodeValue;
      mid.replaceWith(sp); node = rest;
    }
  }
}
document.addEventListener("keydown", e=>{ const t=e.target.closest&&e.target.closest(".gl"); if(t&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); showPop(t);} });

// ---------- links between pages ("see 'For the doctor'" etc.) ----------
const REF_LINKS = [
  [/['‘“"]For the doctor['’”"](?: (?:list|page|section))?/g, "#questions"],
  [/the warning on the Overview page|the warning signs on the Overview tab|Overview tab/g, "#story"],
  [/the ['‘]Diet['’] section/g, "#diet"],
  [/(?:the )?['‘]Medicine guide['’]/g, "#medguide"],
];
function linkRefs(root){
  const view = (location.hash.slice(1)||"story").split("/")[0];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode(n){
    return n.parentElement.closest("a,button,summary,h2,.pop,.backbar,script,style") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT; }});
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  for(let node of nodes){
    while(node){
      let best=null;
      for(const [rx,href] of REF_LINKS){
        if(href==="#"+view) continue;               // don't link a page to itself
        rx.lastIndex=0; const m=rx.exec(node.nodeValue);
        if(m && (!best || m.index<best.i)) best={i:m.index,len:m[0].length,href};
      }
      if(!best) break;
      const mid=node.splitText(best.i), rest=mid.splitText(best.len);
      const a=document.createElement("a"); a.href=best.href; a.className="xref"; a.textContent=mid.nodeValue;
      mid.replaceWith(a); node=rest;
    }
  }
}

// ---------- router ----------
// Remember where the reader was, so "Back" returns to the exact spot.
let cameFrom = null;     // {hash, label} of the page the reader jumped from
let restoreY = null;     // scroll position to restore on back navigation
try { history.scrollRestoration = "manual"; } catch(_) {}
document.addEventListener("click", e=>{
  const a = e.target.closest('a[href^="#"]'); if(!a || a.id==="backbar-btn") return;
  if(a.closest("#tabs")){ cameFrom = null; return; }
  if(a.getAttribute("href")===(location.hash||"#story")) return;
  try { history.replaceState({y: scrollY}, ""); } catch(_) {}
  const cur = (location.hash.slice(1)||"story").split("/")[0];
  const lab = (VIEWS.find(([k])=>k===cur)||[,"previous page"])[1];
  cameFrom = { hash: location.hash||"#story", label: lab };
}, true);
addEventListener("popstate", e=>{ restoreY = (e.state && typeof e.state.y==="number") ? e.state.y : null; });
function backBar(){
  if(cameFrom && cameFrom.hash===(location.hash||"#story")) cameFrom = null;
  if(!cameFrom) return "";
  return `<div class="backbar"><a href="#" id="backbar-btn">← Back to ${esc(cameFrom.label)}, where you left off</a></div>`;
}
document.addEventListener("click", e=>{
  if(!e.target.closest("#backbar-btn")) return;
  e.preventDefault(); cameFrom = null; history.back();
});

function route(){
  const [view, sub] = (location.hash.slice(1)||"story").split("/");
  const v = V[view]?view:"story";
  renderTabs(v);
  $("#view").innerHTML = backBar() + V[v](sub);
  linkRefs($("#view")); linkTerms($("#view"));
  if(restoreY!=null){ const y=restoreY; restoreY=null; requestAnimationFrame(()=>window.scrollTo(0,y)); return; }
  if(sub){ const el = document.getElementById((v==="reports"?"r-":"t-")+sub); if(el){ el.scrollIntoView({block:"start"}); el.animate([{boxShadow:"0 0 0 3px var(--accent)"},{boxShadow:"var(--shadow)"}],{duration:1600}); } }
  else window.scrollTo(0,0);
}
addEventListener("hashchange", route);

// ---------- events ----------
document.addEventListener("click", e=>{
  const f = e.target.closest("[data-filter]");
  if(f){ reportFilter=f.dataset.filter; $("#view").innerHTML=V.reports(); linkRefs($("#view")); linkTerms($("#view")); return; }
  const t = e.target.closest("[data-doc]");
  if(t){ openLB(t.dataset.doc, +t.dataset.i); return; }
  const term = e.target.closest("[data-term]");
  if(term){ e.preventDefault(); showPop(term); e.stopPropagation(); return; }
  hidePop();
});
document.addEventListener("change", e=>{
  if(e.target.matches("[data-q]")){ const d=store.get("qdone",{}); d[e.target.dataset.q]=e.target.checked; store.set("qdone",d); e.target.closest(".q").classList.toggle("done",e.target.checked); }
});

// glossary popover
const pop=$("#pop");
function showPop(el){
  const g=H.glossary[el.dataset.term]; if(!g) return;
  pop.innerHTML=`<b>${esc(g[0])}</b>${esc(g[1])}`; pop.style.display="block";
  const r=el.getBoundingClientRect(), w=Math.min(320,innerWidth-32);
  pop.style.maxWidth=w+"px";
  let left=Math.min(Math.max(16,r.left), innerWidth-w-16);
  pop.style.left=left+"px";
  const below=r.bottom+8, h=pop.offsetHeight;
  pop.style.top=(below+h>innerHeight-8? r.top-h-8 : below)+"px";
}
function hidePop(){ pop.style.display="none"; }
addEventListener("scroll",hidePop,{passive:true});

// lightbox
let lbDoc=null, lbI=0;
function openLB(id,i){ lbDoc=docById[id]; lbI=i; $("#lb").classList.add("open"); document.body.style.overflow="hidden"; showLB(); }
function showLB(){
  const p=lbDoc.pages[lbI];
  $("#lbImg").src=full(p); $("#lbOpen").href=full(p);
  $("#lbCap").textContent=`${lbDoc.title} · page ${lbI+1} of ${lbDoc.pages.length} (scan p.${p})`;
  $("#lbStage").classList.remove("zoom"); $("#lbStage").scrollTo(0,0);
}
function closeLB(){ $("#lb").classList.remove("open"); document.body.style.overflow=""; }
$("#lbClose").onclick=closeLB;
$("#lbPrev").onclick=()=>{ lbI=(lbI-1+lbDoc.pages.length)%lbDoc.pages.length; showLB(); };
$("#lbNext").onclick=()=>{ lbI=(lbI+1)%lbDoc.pages.length; showLB(); };
$("#lbImg").onclick=()=>$("#lbStage").classList.toggle("zoom");
addEventListener("keydown",e=>{
  if(!$("#lb").classList.contains("open")) return;
  if(e.key==="Escape") closeLB(); if(e.key==="ArrowLeft") $("#lbPrev").click(); if(e.key==="ArrowRight") $("#lbNext").click();
});

route();
})();
</script>
